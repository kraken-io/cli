# Publish to npm and update the Homebrew tap on a version tag.
#
# Secrets:
#   NPM_TOKEN           npm Automation token (bypasses 2FA)
#   HOMEBREW_TAP_TOKEN  PAT with Contents:write on kraken-io/homebrew-tap
name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json $pkg"
            exit 1
          fi

      - name: Check version is not already published
        run: |
          name="$(node -p "require('./package.json').name")"
          pkg="$(node -p "require('./package.json').version")"
          if npm view "$name@$pkg" version >/dev/null 2>&1; then
            echo "::error::$name@$pkg already exists"
            exit 1
          fi

      - run: npm ci
      - run: node scripts/sync-version.mjs --check
      - run: npm run lint
      - run: npm test

      # Provenance requires a public repo.
      - name: Publish
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            npm publish
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published tarball
        id: tarball
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          pkg_base="${name##*/}"
          url="https://registry.npmjs.org/${name}/-/${pkg_base}-${version}.tgz"
          for i in $(seq 1 30); do
            if curl -fsSL "$url" -o pkg.tgz; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "sha=$(sha256sum pkg.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url unavailable after 5 minutes"
          exit 1

      - name: Update tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          URL: ${{ steps.tarball.outputs.url }}
          SHA: ${{ steps.tarball.outputs.sha }}
          VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN unset, skipping"
            exit 0
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/kraken-io/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          cp ../Formula/krakenio-cli.rb Formula/krakenio-cli.rb
          sed -i -E "s|url \"[^\"]*\"|url \"${URL}\"|" Formula/krakenio-cli.rb
          sed -i -E "s|sha256 \"[0-9a-f]{64}\"|sha256 \"${SHA}\"|" Formula/krakenio-cli.rb
          grep -q "$SHA" Formula/krakenio-cli.rb

          if git diff --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -am "@kraken-io/cli ${VERSION}"
          git push
